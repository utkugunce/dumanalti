<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2530"/>
      <stop offset="1" stop-color="#0f1115"/>
    </linearGradient>
    <linearGradient id="cig" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.75" stop-color="#f2f2f2"/>
      <stop offset="0.75" stop-color="#ffb547"/>
      <stop offset="1" stop-color="#e89a2b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- cigarette -->
  <g transform="rotate(-18 256 300)">
    <rect x="96" y="280" width="320" height="56" rx="12" fill="url(#cig)"/>
    <rect x="96" y="280" width="40" height="56" rx="12" fill="#ff5a3c"/>
  </g>
  <!-- smoke -->
  <g fill="none" stroke="#9aa3b2" stroke-width="14" stroke-linecap="round" opacity="0.85">
    <path d="M300 180 q30 -28 0 -56 q-30 -28 0 -56"/>
    <path d="M348 168 q26 -24 0 -48 q-26 -24 0 -48"/>
