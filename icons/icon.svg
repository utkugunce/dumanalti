<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"><defs>
  <!-- Gece Yeşimi: nötr charcoal zemin, hafif zümrüt sızıntısı -->
  <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#171b1e"/><stop offset="1" stop-color="#0b0d0f"/></linearGradient>
  <radialGradient id="aura" cx="0.5" cy="0.42" r="0.62"><stop offset="0" stop-color="#22c39a" stop-opacity="0.30"/><stop offset="0.55" stop-color="#22c39a" stop-opacity="0.07"/><stop offset="1" stop-color="#22c39a" stop-opacity="0"/></radialGradient>
  <linearGradient id="leaf" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#4fe0b0"/><stop offset="0.55" stop-color="#22c39a"/><stop offset="1" stop-color="#149f7c"/></linearGradient>
  <linearGradient id="wisp" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#eef2f0" stop-opacity="0.9"/><stop offset="1" stop-color="#eef2f0" stop-opacity="0.12"/></linearGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7"/></filter>
</defs>
  <!-- charcoal jewel tile -->
  <rect width="512" height="512" rx="116" fill="url(#tile)"/>
  <rect width="512" height="512" rx="116" fill="url(#aura)"/>
  <!-- ince üst parlama (cam kenar) -->
  <path d="M116 2 H396 A114 114 0 0 1 510 116" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2.5"/>

  <!-- yükselen duman: yaprağın ucundan tek zarif kıvrım -->
  <path d="M256 196 C 300 168 300 132 268 112 C 244 97 244 74 274 58"
        fill="none" stroke="url(#wisp)" stroke-width="13" stroke-linecap="round" filter="url(#glow)" opacity="0.55"/>
  <path d="M256 196 C 300 168 300 132 268 112 C 244 97 244 74 274 58"
        fill="none" stroke="url(#wisp)" stroke-width="9" stroke-linecap="round"/>

  <!-- zümrüt yaprak (tek, sade, jewel) -->
  <g transform="translate(256 300)">
    <path d="M0 -118 C 72 -84 82 20 0 106 C -82 20 -72 -84 0 -118 Z" fill="url(#leaf)"/>
    <!-- orta damar -->
    <path d="M0 -104 L0 96" fill="none" stroke="#0b3a2c" stroke-width="6" stroke-linecap="round" opacity="0.45"/>
    <!-- yan damarlar -->
    <path d="M0 -58 C 22 -50 34 -40 40 -22" fill="none" stroke="#0b3a2c" stroke-width="4.5" stroke-linecap="round" opacity="0.38"/>
    <path d="M0 -58 C -22 -50 -34 -40 -40 -22" fill="none" stroke="#0b3a2c" stroke-width="4.5" stroke-linecap="round" opacity="0.38"/>
    <path d="M0 -8 C 26 0 42 12 50 34" fill="none" stroke="#0b3a2c" stroke-width="4.5" stroke-linecap="round" opacity="0.38"/>
    <path d="M0 -8 C -26 0 -42 12 -50 34" fill="none" stroke="#0b3a2c" stroke-width="4.5" stroke-linecap="round" opacity="0.38"/>
    <!-- jewel parlaması -->
    <path d="M-18 -86 C 24 -62 30 6 -6 62 C -34 8 -40 -58 -18 -86 Z" fill="#ffffff" opacity="0.14"/>
  </g>
</svg>
