<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2036"/>
      <stop offset="1" stop-color="#0a0c12"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.82" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#4f9dff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4f9dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="0.15" cy="0.9" r="0.75">
      <stop offset="0" stop-color="#ff5fa2" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ff5fa2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="smoke" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#c9d4e6"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="ember" cx="0.5" cy="0.4" r="0.65">
      <stop offset="0" stop-color="#ffd9a0"/>
      <stop offset="0.45" stop-color="#ffb547"/>
      <stop offset="1" stop-color="#f0693c"/>
    </radialGradient>
    <radialGradient id="emberGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff9c4a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff9c4a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- zemin: koyu squircle + uygulamanın ışık lekeleri -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#glowBlue)"/>
  <rect width="512" height="512" rx="116" fill="url(#glowPink)"/>

  <!-- közden yükselip kalbe dönüşen duman şeridi -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- arkadaki soluk yankı: duman hissi -->
    <path d="M256 426 C 230 392 282 370 256 322 C 118 244 148 96 256 170 C 364 96 394 244 256 322"
          stroke="#ffffff" stroke-width="58" opacity="0.14"/>
    <!-- ana şerit -->
    <path d="M256 426 C 230 392 282 370 256 322 C 118 244 148 96 256 170 C 364 96 394 244 256 322"
          stroke="url(#smoke)" stroke-width="34"/>
  </g>

  <!-- köz: turuncu parlayan uç -->
  <circle cx="256" cy="428" r="64" fill="url(#emberGlow)"/>
  <circle cx="256" cy="428" r="26" fill="url(#ember)"/>
</svg>
